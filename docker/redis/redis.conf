# Shared Redis for every service. Two roles:
#   1. Event bus (Redis Streams: events:quiz/auth/questionbank/session/violation/scheduler)
#      — consumed by quiz, exam, analytics, questionbank; NOT disposable.
#   2. Cache + coordination (snapshots, revoked-token denylist, rate limits, locks)
#      — used by auth, quiz, exam, questionbank; disposable (PostgreSQL fallback).

bind 0.0.0.0
protected-mode no
port 6379

# Bound memory. volatile-lru evicts only keys that carry a TTL (the cache keys), so the
# event streams (no TTL, bounded by MAXLEN in publishers) are never evicted.
maxmemory 256mb
maxmemory-policy volatile-lru

# Persist so a restart does not drop undelivered stream entries. Streams are durable; the
# cache simply warms again. AOF trades some write throughput for that durability.
appendonly yes
appendfsync everysec
save ""

timeout 300
tcp-keepalive 60
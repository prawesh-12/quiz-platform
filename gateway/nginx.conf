# Pass-through to the monolith. Add per-service locations (most specific first) as services split.

upstream api {
  server api:5000;
}

server {
  listen 80;

  # Mint a correlation id when the client did not send one; every service logs it.
  proxy_set_header X-Request-ID $request_id;
  # Strip any inbound internal-auth header so it can never be forged from outside.
  proxy_set_header X-Internal-Key "";

  location / {
    proxy_pass http://api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

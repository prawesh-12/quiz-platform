# Auth: login/teachers/avatars. Question Bank: subjects/units/questions. Quiz: quiz CRUD,
# scheduling, quiz-history. Monolith: exam (sessions/violations), dashboards, and the
# teacher-monitoring quiz views (live-stats/leaderboard/export/responses).

upstream api {
  server api:5000;
}

upstream auth {
  server auth:5000;
}

upstream questionbank {
  server questionbank:5000;
}

upstream quiz {
  server quiz:5000;
}

server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Internal-Key "";

  location = /api/teachers/me/avatar { proxy_pass http://auth; }
  location ~ ^/api/teachers/[^/]+/avatar$ { proxy_pass http://auth; }
  location ~ ^/api/subjects/[^/]+/quiz-history$ { proxy_pass http://quiz; }
  location ~ ^/api/quizzes/[^/]+/(live-stats|leaderboard|export|responses)$ { proxy_pass http://api; }

  location /api/auth/ { proxy_pass http://auth; }
  location /api/admin/teachers { proxy_pass http://auth; }
  location /api/admin/schools/ { proxy_pass http://auth; }

  location /api/admin/subjects { proxy_pass http://questionbank; }
  location /api/subjects/ { proxy_pass http://questionbank; }
  location /api/units/ { proxy_pass http://questionbank; }
  location /api/questions/ { proxy_pass http://questionbank; }

  location /api/quizzes/ { proxy_pass http://quiz; }

  location / { proxy_pass http://api; }
}

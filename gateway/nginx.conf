# API gateway: routes each /api path to its owning service; non-API paths 404 (the SPA is
# served separately). Auth: login/teachers/avatars. Question Bank: subjects/units/questions.
# Quiz: quiz CRUD, scheduling, quiz-history. Analytics: dashboards. Exam: sessions,
# violations, and the teacher-monitoring quiz views.

server {
  listen 80;

  # Allow avatar uploads (app limit is 2MB) through the gateway; default 1MB would 413 them.
  client_max_body_size 3m;

  # Docker DNS + per-request $svc resolution so recreated containers (new IPs) need no reload.
  resolver 127.0.0.11 valid=10s ipv6=off;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Internal-Key "";

  # Per-service readiness: maps a distinct gateway path to each service's own /api/ready so
  # the SPA warmup can confirm every backend it needs is up, not just the catch-all (exam).
  location = /api/auth/ready { set $svc auth:5000; proxy_pass http://$svc/api/ready; }
  location = /api/questionbank/ready { set $svc questionbank:5000; proxy_pass http://$svc/api/ready; }
  location = /api/quiz/ready { set $svc quiz:5000; proxy_pass http://$svc/api/ready; }
  location = /api/analytics/ready { set $svc analytics:5000; proxy_pass http://$svc/api/ready; }
  location = /api/exam/ready { set $svc exam:5000; proxy_pass http://$svc/api/ready; }

  location = /api/teachers/me/avatar { set $svc auth:5000; proxy_pass http://$svc$request_uri; }
  location ~ ^/api/teachers/[^/]+/avatar$ { set $svc auth:5000; proxy_pass http://$svc$request_uri; }
  location ~ ^/api/subjects/[^/]+/quiz-history$ { set $svc quiz:5000; proxy_pass http://$svc$request_uri; }
  location ~ ^/api/quizzes/[^/]+/(live-stats|leaderboard|export|responses)$ { set $svc exam:5000; proxy_pass http://$svc$request_uri; }

  location /api/admin/dashboard { set $svc analytics:5000; proxy_pass http://$svc$request_uri; }
  location /api/teachers/dashboard { set $svc analytics:5000; proxy_pass http://$svc$request_uri; }

  location /api/auth { set $svc auth:5000; proxy_pass http://$svc$request_uri; }
  location /api/admin/teachers { set $svc auth:5000; proxy_pass http://$svc$request_uri; }
  location /api/admin/schools { set $svc auth:5000; proxy_pass http://$svc$request_uri; }

  location /api/admin/subjects { set $svc questionbank:5000; proxy_pass http://$svc$request_uri; }
  location /api/subjects { set $svc questionbank:5000; proxy_pass http://$svc$request_uri; }
  location /api/units { set $svc questionbank:5000; proxy_pass http://$svc$request_uri; }
  location /api/questions { set $svc questionbank:5000; proxy_pass http://$svc$request_uri; }

  location /api/quizzes { set $svc quiz:5000; proxy_pass http://$svc$request_uri; }

  location /api/sessions { set $svc exam:5000; proxy_pass http://$svc$request_uri; }
  location /api/violations { set $svc exam:5000; proxy_pass http://$svc$request_uri; }
  location /api/ { set $svc exam:5000; proxy_pass http://$svc$request_uri; }

  # API gateway only; the SPA is served separately (Vite locally, Vercel in prod).
  location / { return 404; }
}

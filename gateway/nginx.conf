# Auth owns login, teacher management, and avatars; everything else stays on the monolith.

upstream api {
  server api:5000;
}

upstream auth {
  server auth:5000;
}

server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Internal-Key "";

  location /api/auth/ { proxy_pass http://auth; }
  location /api/admin/teachers { proxy_pass http://auth; }
  location /api/admin/schools/ { proxy_pass http://auth; }
  location = /api/teachers/me/avatar { proxy_pass http://auth; }
  location ~ ^/api/teachers/[^/]+/avatar$ { proxy_pass http://auth; }

  location / { proxy_pass http://api; }
}

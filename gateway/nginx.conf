# Routes each path to its owning service; everything non-API is the static SPA. Auth:
# login/teachers/avatars. Question Bank: subjects/units/questions. Quiz: quiz CRUD,
# scheduling, quiz-history. Analytics: dashboards. Exam: sessions, violations, and the
# teacher-monitoring quiz views.

upstream auth {
  server auth:5000;
}

upstream questionbank {
  server questionbank:5000;
}

upstream quiz {
  server quiz:5000;
}

upstream analytics {
  server analytics:5000;
}

upstream exam {
  server exam:5000;
}

server {
  listen 80;

  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Request-ID $request_id;
  proxy_set_header X-Internal-Key "";

  location = /api/teachers/me/avatar { proxy_pass http://auth; }
  location ~ ^/api/teachers/[^/]+/avatar$ { proxy_pass http://auth; }
  location ~ ^/api/subjects/[^/]+/quiz-history$ { proxy_pass http://quiz; }
  location ~ ^/api/quizzes/[^/]+/(live-stats|leaderboard|export|responses)$ { proxy_pass http://exam; }

  location /api/admin/dashboard/ { proxy_pass http://analytics; }
  location /api/teachers/dashboard/ { proxy_pass http://analytics; }

  location /api/auth/ { proxy_pass http://auth; }
  location /api/admin/teachers { proxy_pass http://auth; }
  location /api/admin/schools/ { proxy_pass http://auth; }

  location /api/admin/subjects { proxy_pass http://questionbank; }
  location /api/subjects/ { proxy_pass http://questionbank; }
  location /api/units/ { proxy_pass http://questionbank; }
  location /api/questions/ { proxy_pass http://questionbank; }

  location /api/quizzes/ { proxy_pass http://quiz; }

  location /api/sessions/ { proxy_pass http://exam; }
  location /api/violations/ { proxy_pass http://exam; }
  location /api/ { proxy_pass http://exam; }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}

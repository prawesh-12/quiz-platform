# One command runs the whole platform locally. By default it brings up the gateway, the
# monolith API, the scheduler (worker), and Redis. The five domain services are defined
# under the "split" profile so the target topology exists now and is activated per
# extraction:  docker compose --profile split up
#
# Every service currently runs the same monolith image; each is narrowed to its own
# domain (and its own database) when it is extracted.

x-monolith: &monolith
  build: ./server
  image: quizloom-server
  env_file:
    - ./server/.env
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    build: ./docker/redis
    image: quizloom-redis
    container_name: quizloom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    <<: *monolith
    container_name: quizloom-api
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"
    expose:
      - "5000"

  scheduler:
    <<: *monolith
    container_name: quizloom-scheduler
    command: ["node", "worker.js"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "true"

  gateway:
    image: nginx:1.27-alpine
    container_name: quizloom-gateway
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  auth:
    <<: *monolith
    profiles: ["split"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"

  questionbank:
    <<: *monolith
    profiles: ["split"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"

  quiz:
    <<: *monolith
    profiles: ["split"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"

  exam:
    <<: *monolith
    profiles: ["split"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"

  analytics:
    <<: *monolith
    profiles: ["split"]
    environment:
      REDIS_URL: redis://redis:6379
      SCHEDULER_ENABLED: "false"

services:
  redis:
    build: ./docker/redis
    image: ${IMAGE_REPO:-quizloom}/redis:${IMAGE_TAG:-dev}
    container_name: quizloom-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  gateway:
    image: nginx:1.27-alpine
    container_name: quizloom-gateway
    depends_on:
      - auth
      - questionbank
      - quiz
      - analytics
      - exam
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  auth:
    build: ./services/auth
    image: ${IMAGE_REPO:-quizloom}/auth:${IMAGE_TAG:-dev}
    container_name: quizloom-auth
    env_file:
      - ./services/auth/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  questionbank:
    build: ./services/questionbank
    image: ${IMAGE_REPO:-quizloom}/questionbank:${IMAGE_TAG:-dev}
    container_name: quizloom-questionbank
    env_file:
      - ./services/questionbank/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  quiz:
    build: ./services/quiz
    image: ${IMAGE_REPO:-quizloom}/quiz:${IMAGE_TAG:-dev}
    container_name: quizloom-quiz
    env_file:
      - ./services/quiz/.env.production
    environment:
      REDIS_URL: redis://redis:6379
      QUESTIONBANK_INTERNAL_URL: http://questionbank:5000
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  analytics:
    build: ./services/analytics
    image: ${IMAGE_REPO:-quizloom}/analytics:${IMAGE_TAG:-dev}
    container_name: quizloom-analytics
    env_file:
      - ./services/analytics/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  exam:
    build: ./services/exam
    image: ${IMAGE_REPO:-quizloom}/exam:${IMAGE_TAG:-dev}
    container_name: quizloom-exam
    env_file:
      - ./services/exam/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "5000"
    restart: unless-stopped

  exam-worker:
    build: ./services/exam
    image: ${IMAGE_REPO:-quizloom}/exam:${IMAGE_TAG:-dev}
    container_name: quizloom-exam-worker
    command: ["node", "worker.js"]
    env_file:
      - ./services/exam/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: ./services/scheduler
    image: ${IMAGE_REPO:-quizloom}/scheduler:${IMAGE_TAG:-dev}
    container_name: quizloom-scheduler
    env_file:
      - ./services/scheduler/.env.production
    environment:
      REDIS_URL: redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

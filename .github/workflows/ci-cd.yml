name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  APP_DIR: /opt/quizloom
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/quizloom

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            services/*/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix client
          for service in services/*/; do
            npm ci --prefix "$service"
          done

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Event consumer tests
        env:
          REDIS_URL: redis://localhost:6379
        run: npm run test:events

      - name: Build client
        run: npm run build

  images:
    name: Build and push images
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: redis
            context: ./docker/redis
          - name: auth
            context: ./services/auth
          - name: questionbank
            context: ./services/questionbank
          - name: quiz
            context: ./services/quiz
          - name: exam
            context: ./services/exam
          - name: analytics
            context: ./services/analytics
          - name: scheduler
            context: ./services/scheduler
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ env.IMAGE_REPO }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to EC2
    needs: images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Load the SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Piped in so the host runs this commit's script, not the one it already has.
      - name: Deploy and health-check
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "APP_DIR='${{ env.APP_DIR }}' IMAGE_REPO='${{ env.IMAGE_REPO }}' \
             GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' \
             bash -s -- '${{ github.sha }}'" < scripts/deploy.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tests against the live site
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
        run: npm run test:integration

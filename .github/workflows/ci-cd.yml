name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  NODE_VERSION: "20"
  APP_DIR: /opt/quizloom

jobs:
  checks:
    name: Lint and build
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json
            services/*/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix client
          for service in services/*/; do
            npm ci --prefix "$service"
          done

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit

      - name: Event consumer tests
        env:
          REDIS_URL: redis://localhost:6379
        run: npm run test:events

      - name: Build client
        run: npm run build

  deploy:
    name: Deploy to the VPS
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency: deploy-production
    steps:
      - uses: actions/checkout@v4

      - name: Join the tailnet
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci

      - name: Load the SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      # Piped in so the host runs this commit's script, not the one it already has.
      - name: Deploy and health-check
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "APP_DIR='${{ env.APP_DIR }}' bash -s -- '${{ github.sha }}'" < scripts/deploy.sh

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Tests against the live site
        env:
          GATEWAY_URL: http://${{ secrets.VPS_HOST }}:8080
          TEST_ADMIN_EMAIL: ${{ secrets.TEST_ADMIN_EMAIL }}
          TEST_ADMIN_PASSWORD: ${{ secrets.TEST_ADMIN_PASSWORD }}
          TEST_TEACHER_EMAIL: ${{ secrets.TEST_TEACHER_EMAIL }}
          TEST_TEACHER_PASSWORD: ${{ secrets.TEST_TEACHER_PASSWORD }}
        run: npm run test:integration
